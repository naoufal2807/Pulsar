[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-dq"
version = "0.1.0"
description = "Profile your data in seconds. CLI-first data quality platform."
authors = [{name = "Naoufal SAADI", email = "naoufal@vortx.ai"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "polars>=0.19.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pulsar = "pulsar.cli:app"

[tool.setuptools]
packages = ["pulsar"]

[tool.setuptools.package-data]
pulsar = ["*.yaml", "*.svg"]
