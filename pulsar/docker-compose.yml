# docker-compose.yml - Pulsar 2.0 Full Stack

version: '3.8'

services:
  # Ollama Service (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: pulsar-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - pulsar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: serve

  # Pulsar Application
  pulsar:
    build: .
    container_name: pulsar-app
    ports:
      - "8000:8000"    
      - "8888:8888"   
    volumes:
      - ./pulsar:/app/pulsar
      - ./tests:/app/tests
      - ./config:/app/config
      - pulsar-data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PYTHONUNBUFFERED=1
      - ENV=development
    networks:
      - pulsar-network
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL for storing baselines/results
  postgres:
    image: postgres:15-alpine
    container_name: pulsar-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=pulsar
      - POSTGRES_PASSWORD=pulsar_dev_123
      - POSTGRES_DB=pulsar_db
    networks:
      - pulsar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: pulsar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - pulsar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  pulsar-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  pulsar-data:
    driver: local